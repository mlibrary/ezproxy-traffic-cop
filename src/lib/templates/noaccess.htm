<!DOCTYPE html>
<html>
  <head>
    <title>Access denied</title>
    <script type="text/javascript" src="https://www.lib.umich.edu/shared-files/code/js/html5shiv-printshiv.js"></script>
    <style type="text/css">
      * { margin: 0; }

      a:focus { outline: 2px solid #55F; }

      body {
        min-width: 25em;
        background-color: #E0E0E5;
        font-size: 1.1em;
        color: #444;
        font-family: Helvetica, Arial, sans-serif;
        padding-bottom: 2em;
      }

      main, header { padding: 0 1em; }

      header {
        background-color: #00274C;
        color: #FFF;
        min-height: 4em;
      }

      .centered {
        display: block;
        max-width: 38em;
        margin: 0 auto;
      }

      main .centered {
        background-color: #FFF;
        padding: 2em;
        max-width: 34em;
      }

      main * + * { margin-top: 1em; }

      hr {
        border: 0;
        border-top: 0.2em solid #00274C;
        margin: 2em 0;
      }

      header * {
        display: inline-block;
        vertical-align: middle;
      }

      h1 {
        font-size: 1.8em;
        font-weight: normal;
        font-family: Georgia, Palatino, 'Palatino Linotype', 'Palatino LT STD', 'Book Antiqua', serif;
      }

      .home-link {
        height: 2.5em;
        padding: 0.75em;
        padding-right: 0.6em;
      }

      .home-link img {
        height: 100%;
        width: auto;
        padding-right: 1em;
        border: 0;
        border-right: 1px solid #FFF;
      }

      @media (max-width: 45em) {
        body { font-size: 1em; }

        header {
          font-size: 0.7em;
          padding: 0 1.4em;
        }

        header .centered { max-width: 54.3em; }

        main .centered {
          padding: 1.5em;
          max-width: 35em;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="centered">
        <a href="https://www.lib.umich.edu" title="U-M Library" rel="home" class="home-link">
          <img src="https://www.lib.umich.edu/shared-files/graphics/logos/blogs_umlib_logo_square_trans.png" alt="U-M Library" width="44">
        </a>
        <h1>Access denied</h1>
      <div>
    </header>
    <main>
      <div class="centered">
        <p>
          The library's proxy server cannot connect you to this resource.  It was unable to verify your current relationship with the University.
        </p>
    </main>
  </body>
</html>
