---
services:
  web:
    build:
      context: .
    env_file:
    - .env
    volumes:
    - ./src/html:/var/www/html
    - ./src/lib:/var/www/lib
    - ./config:/var/www/config
    ports:
    - "3000:80"

  apache-exporter:
    image: bitnami/apache-exporter:latest@sha256:74e695f827434fd6a99ca62ea08f828461abe51015cb3406691cc187b4cb2664
    command: [ "--scrape_uri=http://web:81/server-status?auto" ]
    depends_on:
      - web
    profiles:
      - monitoring
